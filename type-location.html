<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CARISME — Type de location</title>
  <meta name="description" content="CARISME — Choisissez votre expérience de location de luxe à Paris.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream:    #F5F0E8;
      --warm:     #EDE5D5;
      --gold:     #B8965A;
      --gold-lt:  #D4AF74;
      --dark:     #1A1612;
      --charcoal: #2C2620;
      --muted:    rgba(26,22,18,0.45);
      --serif:    'Playfair Display', Georgia, serif;
      --sans:     'Jost', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--cream);
      color: var(--dark);
      font-family: var(--sans);
      font-weight: 300;
      overflow: hidden;
      cursor: none;
      height: 100vh;
    }

    /* ── CUSTOM CURSOR ── */
    .cursor {
      width: 8px; height: 8px;
      background: var(--gold);
      border-radius: 50%;
      position: fixed;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.1s, width 0.3s, height 0.3s, background 0.3s;
    }
    .cursor-ring {
      width: 36px; height: 36px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      position: fixed;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: transform 0.12s ease-out, width 0.3s, height 0.3s, opacity 0.3s;
      opacity: 0.6;
    }

    /* ── LIEN RETOUR ── */
    .back-link {
      position: fixed;
      top: 2rem;
      left: 2.5rem;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-family: var(--sans);
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--dark);
      text-decoration: none;
      opacity: 0;
      animation: fadeIn 0.8s ease 0.2s forwards;
      transition: color 0.2s;
    }
    .back-link::before {
      content: '←';
      font-size: 0.9rem;
      color: var(--gold);
      transition: transform 0.2s;
    }
    .back-link:hover { color: var(--gold); }
    .back-link:hover::before { transform: translateX(-4px); }

    /* ── LOGO ── */
    .logo {
      position: fixed;
      top: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      font-family: var(--serif);
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: 0.35em;
      color: var(--dark);
      text-decoration: none;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeIn 0.8s ease 0.2s forwards;
    }

    /* ── LAYOUT PRINCIPAL ── */
    .page {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── EN-TÊTE ── */
    .page-header {
      flex-shrink: 0;
      text-align: center;
      padding: 5.5rem 2rem 2rem;
      position: relative;
      z-index: 2;
    }

    .page-eyebrow {
      font-family: var(--sans);
      font-size: 0.65rem;
      font-weight: 400;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1rem;
      opacity: 0;
      animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }

    .page-title {
      font-family: var(--serif);
      font-size: clamp(1.8rem, 3.5vw, 2.8rem);
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--dark);
      opacity: 0;
      animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.45s forwards;
    }

    .page-divider {
      width: 50px;
      height: 1px;
      background: var(--gold);
      margin: 1.2rem auto 0;
      opacity: 0;
      animation: expandLine 0.8s ease 0.7s forwards;
    }

    /* ── DEUX PANNEAUX ── */
    .panels {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 0;
    }

    /* Séparateur vertical doré */
    .panels::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      left: 50%;
      width: 1px;
      background: linear-gradient(to bottom, transparent, var(--gold) 20%, var(--gold) 80%, transparent);
      pointer-events: none;
      z-index: 2;
    }
    .panels { position: relative; }

    .panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 3.5rem 3rem;
      position: relative;
      overflow: hidden;
      gap: 1.8rem;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
    }
    .panel:first-child { animation-delay: 0.6s; }
    .panel:last-child  { animation-delay: 0.8s; }

    /* Hover : fond légèrement plus chaud */
    .panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--warm);
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: 0;
    }
    .panel:hover::before { opacity: 1; }

    .panel > * { position: relative; z-index: 1; }

    /* ── TITRE DU PANNEAU ── */
    .panel-title {
      font-family: var(--serif);
      font-size: clamp(1.4rem, 2.2vw, 1.9rem);
      font-weight: 400;
      font-style: italic;
      color: var(--charcoal);
      text-align: center;
      line-height: 1.25;
      transition: color 0.3s;
    }
    .panel:hover .panel-title { color: var(--dark); }

    /* ── IMAGE ── */
    .panel-image {
      width: 100%;
      max-width: 480px;
      aspect-ratio: 4 / 3;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .panel-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .panel:hover .panel-image img { transform: scale(1.06); }

    /* Overlay doré au hover */
    .panel-image-overlay {
      position: absolute;
      inset: 0;
      background: var(--gold);
      opacity: 0;
      mix-blend-mode: multiply;
      transition: opacity 0.5s ease;
    }
    .panel:hover .panel-image-overlay { opacity: 0.08; }

    /* ── BOUTON ── */
    .panel-cta {
      display: inline-block;
      font-family: var(--sans);
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--dark);
      text-decoration: none;
      padding: 0.9rem 2.4rem;
      border: 1px solid var(--gold);
      position: relative;
      overflow: hidden;
      transition: color 0.4s;
    }
    .panel-cta::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gold);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.4s ease;
    }
    .panel-cta:hover::before { transform: scaleX(1); }
    .panel-cta:hover { color: var(--cream); }
    .panel-cta span { position: relative; z-index: 1; }

    /* ── ANIMATIONS ── */
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes expandLine {
      from { opacity: 0; width: 0; }
      to   { opacity: 1; width: 50px; }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      body { overflow: auto; }

      .panels {
        grid-template-columns: 1fr;
        height: auto;
      }
      .panels::after { display: none; }

      .panel {
        padding: 2.5rem 1.5rem;
        border-bottom: 1px solid var(--warm);
      }
      .panel:last-child { border-bottom: none; }

      .panel-image { max-width: 100%; }

      .page-header { padding: 4.5rem 1.5rem 1.5rem; }

      .back-link { top: 1.2rem; left: 1.2rem; }
      .logo { font-size: 0.9rem; }
    }
  </style>
</head>
<body>

  <!-- Curseur -->
  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursor-ring"></div>

  <!-- Retour -->
  <a href="index.html" class="back-link">Retour</a>

  <!-- Logo -->
  <a href="index.html" class="logo">Carisme</a>

  <!-- PAGE -->
  <div class="page">

    <!-- En-tête -->
    <div class="page-header">
      <div class="page-eyebrow">Location · Paris</div>
      <h1 class="page-title">Choisissez votre expérience</h1>
      <div class="page-divider"></div>
    </div>

    <!-- Panneaux -->
    <div class="panels">

      <!-- GAUCHE : Je conduis -->
      <div class="panel">
        <h2 class="panel-title">C'est moi qui conduis&nbsp;!</h2>
        <div class="panel-image">
          <img src="images/conduis.jpg" alt="Je conduis">
          <div class="panel-image-overlay"></div>
        </div>
        <a href="flotte-conduis.html" class="panel-cta"><span>Découvrir</span></a>
      </div>

      <!-- DROITE : Avec chauffeur -->
      <div class="panel">
        <h2 class="panel-title">Je veux un super chauffeur&nbsp;!</h2>
        <div class="panel-image">
          <img src="images/chauffeur.jpg" alt="Avec chauffeur">
          <div class="panel-image-overlay"></div>
        </div>
        <a href="#" class="panel-cta"><span>Découvrir</span></a>
      </div>

    </div>
  </div>

  <script>
    // Curseur personnalisé
    const cursor = document.getElementById('cursor');
    const ring   = document.getElementById('cursor-ring');
    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top  = e.clientY + 'px';
      setTimeout(() => {
        ring.style.left = e.clientX + 'px';
        ring.style.top  = e.clientY + 'px';
      }, 80);
    });

    document.querySelectorAll('a, button').forEach(el => {
      el.addEventListener('mouseenter', () => {
        cursor.style.width  = '14px';
        cursor.style.height = '14px';
        ring.style.width    = '56px';
        ring.style.height   = '56px';
      });
      el.addEventListener('mouseleave', () => {
        cursor.style.width  = '8px';
        cursor.style.height = '8px';
        ring.style.width    = '36px';
        ring.style.height   = '36px';
      });
    });
  </script>
</body>
</html>
